<article class="reviews__slide" data-media-item data-rating="###rating_value###" data-featured="###featured###" data-provider="###provider###">
	[if '###render_rating###'=='1']
	<div class="reviews__rating"><span data-rating="###rating_value###" aria-label="###rating_label###"><i data-rateme="1"></i><i data-rateme="2"></i><i data-rateme="3"></i><i data-rateme="4"></i><i data-rateme="5"></i></span></div>
	[/if]
	<blockquote class="reviews__text">###text###</blockquote>
	<footer class="reviews__meta">
		[if '###has_author###'=='1']
		<span class="reviews__author">###author###</span>
		[/if]
		[if '###render_source###'=='1']
		<span class="reviews__source">###source###</span>
		[/if]
		[if '###render_provider_logo###'=='1']
		<img class="reviews__provider-logo" src="###provider_logo###" alt="###provider_alt###" width="16" height="16">
		[/if]
		[if '###render_date###'=='1']
		<time class="reviews__date" datetime="###datetime###">###date###</time>
		[/if]
	</footer>
</article>
