<div class="reviews__summary-item">
	[if '###summary_label###'!='']
	<span class="reviews__summary-label">###summary_label###</span>
	[/if]
	<strong class="reviews__summary-average">###average###</strong>
	<span class="reviews__summary-stars"><span data-rating="###summary_rating_value###" role="img" aria-label="###average_label###"><i data-rateme="1" class="fa fa-solid fa-star" aria-hidden="true"></i><i data-rateme="2" class="fa fa-solid fa-star" aria-hidden="true"></i><i data-rateme="3" class="fa fa-solid fa-star" aria-hidden="true"></i><i data-rateme="4" class="fa fa-solid fa-star" aria-hidden="true"></i><i data-rateme="5" class="fa fa-solid fa-star" aria-hidden="true"></i></span></span>
	<span class="reviews__summary-count">###count###</span>
</div>
