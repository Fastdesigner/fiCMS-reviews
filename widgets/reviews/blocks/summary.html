<div class="reviews__summary-item" aria-label="###average_label###">
	[if '###summary_label###'!='']
	<span class="reviews__summary-label">###summary_label###</span>
	[/if]
	<strong class="reviews__summary-average">###average###</strong>
	<span class="reviews__summary-stars"><span data-rating="###summary_rating_value###" aria-label="###average_label###"><i data-rateme="1"></i><i data-rateme="2"></i><i data-rateme="3"></i><i data-rateme="4"></i><i data-rateme="5"></i></span></span>
	<span class="reviews__summary-count">###count###</span>
</div>
